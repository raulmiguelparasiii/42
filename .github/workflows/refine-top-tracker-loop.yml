name: Refine top tracker loop

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine tracker geometry
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} anchor count: {count}")
              return text.replace(old, new, 1)

          index_path = Path('index.html')
          text = index_path.read_text()

          old_constants = """      const TOP_TRACKER_LOOP = 10.8;
      const TOP_TRACKER_HOLD = 1.8;
      const TOP_TRACKER_PHASE = TOP_TRACKER_LOOP + TOP_TRACKER_HOLD;
      const TOP_TRACKER_CYCLE = TOP_TRACKER_PHASE * TOP_TRACKER_LOBES.length;
      const TOP_TRACKER_EXTENT = 0.82;
      let topTrackerTime = 0;"""
          new_constants = """      const TOP_TRACKER_LOOP = 10.8;
      const TOP_TRACKER_HOLD = 1.8;
      const TOP_TRACKER_PHASE = TOP_TRACKER_LOOP + TOP_TRACKER_HOLD;
      const TOP_TRACKER_CYCLE = TOP_TRACKER_PHASE * TOP_TRACKER_LOBES.length;
      const TOP_TRACKER_LOBE_CENTER = 0.42;
      const TOP_TRACKER_LOBE_WIDTH = 0.24;
      let topTrackerTime = 0;"""
          text = replace_once(text, old_constants, new_constants, 'tracker constants')

          old_motion = """        const centerX = lobe.x * 0.5;
        const centerZ = lobe.z * 0.5;
        const radialX = -centerX;
        const radialZ = -centerZ;
        let x = centerX + radialX * Math.cos(theta) - radialZ * Math.sin(theta);
        let z = centerZ + radialX * Math.sin(theta) + radialZ * Math.cos(theta);

        const l1 = Math.abs(x) + Math.abs(z);
        if (l1 > 1) {
          x /= l1;
          z /= l1;
        }

        x *= TOP_TRACKER_EXTENT;
        z *= TOP_TRACKER_EXTENT;

        return { x, z, mature: false };"""
          new_motion = """        const centerX = lobe.x * TOP_TRACKER_LOBE_CENTER;
        const centerZ = lobe.z * TOP_TRACKER_LOBE_CENTER;
        const tangentX = lobe.z;
        const tangentZ = -lobe.x;
        const cos = Math.cos(theta);
        const sin = Math.sin(theta);
        const x = centerX * (1 - cos) + tangentX * TOP_TRACKER_LOBE_WIDTH * sin;
        const z = centerZ * (1 - cos) + tangentZ * TOP_TRACKER_LOBE_WIDTH * sin;

        return { x, z, mature: false };"""
          text = replace_once(text, old_motion, new_motion, 'tracker motion')
          index_path.write_text(text)

          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text()
          old_agents = "The generated lobe is first constrained to the top L1 surface and then uniformly inset to 82% of that radius, so the red point keeps a visible gap from the wireframe border instead of touching the endpoints or edges literally."
          new_agents = "Each lobe is generated directly as a smooth inset ellipse centered roughly midway toward its focal endpoint, starting and ending at M; it stays inside the top L1 boundary by construction rather than being clipped or normalized against the border, so the flower motion remains curved throughout."
          agents = replace_once(agents, old_agents, new_agents, 'AGENTS tracker geometry')
          agents_path.write_text(agents)
          PY
      - name: Validate and commit
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('script block missing');
          new Function(match[1]);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html AGENTS.md
          git commit -m "Smooth top tracker petal loops"
          git push
