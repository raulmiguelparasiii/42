name: Refine top tracker loop

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine tracker geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          text = index_path.read_text()

          old_constant = "      const TOP_TRACKER_EXTENT = 0.82;\n"
          new_constants = "      const TOP_TRACKER_LOBE_CENTER = 0.42;\n      const TOP_TRACKER_LOBE_WIDTH = 0.24;\n"
          if text.count(old_constant) != 1:
              raise SystemExit(f"tracker extent anchor count: {text.count(old_constant)}")
          text = text.replace(old_constant, new_constants, 1)

          start_anchor = "        const centerX = lobe.x * 0.5;"
          end_anchor = "        return { x, z, mature: false };"
          if text.count(start_anchor) != 1:
              raise SystemExit(f"tracker motion start count: {text.count(start_anchor)}")
          start = text.index(start_anchor)
          end = text.index(end_anchor, start) + len(end_anchor)
          new_motion = '\n'.join([
              "        const centerX = lobe.x * TOP_TRACKER_LOBE_CENTER;",
              "        const centerZ = lobe.z * TOP_TRACKER_LOBE_CENTER;",
              "        const tangentX = lobe.z;",
              "        const tangentZ = -lobe.x;",
              "        const cos = Math.cos(theta);",
              "        const sin = Math.sin(theta);",
              "        const x = centerX * (1 - cos) + tangentX * TOP_TRACKER_LOBE_WIDTH * sin;",
              "        const z = centerZ * (1 - cos) + tangentZ * TOP_TRACKER_LOBE_WIDTH * sin;",
              "",
              "        return { x, z, mature: false };"
          ])
          text = text[:start] + new_motion + text[end:]
          index_path.write_text(text)

          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text()
          old_agents = "The generated lobe is first constrained to the top L1 surface and then uniformly inset to 82% of that radius, so the red point keeps a visible gap from the wireframe border instead of touching the endpoints or edges literally."
          new_agents = "Each lobe is generated directly as a smooth inset ellipse centered roughly midway toward its focal endpoint, starting and ending at M; it stays inside the top L1 boundary by construction rather than being clipped or normalized against the border, so the flower motion remains curved throughout."
          if agents.count(old_agents) != 1:
              raise SystemExit(f"AGENTS tracker geometry anchor count: {agents.count(old_agents)}")
          agents_path.write_text(agents.replace(old_agents, new_agents, 1))
          PY
      - name: Validate and commit
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('script block missing');
          new Function(match[1]);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html AGENTS.md
          git commit -m "Smooth top tracker petal loops"
          git push
