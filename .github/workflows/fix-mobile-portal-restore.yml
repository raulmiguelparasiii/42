name: Fix mobile portal restore jump

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-portal-restore.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch atomic portal restore
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = """const finishBlackPortalRestore = saved => {
            if (!saved) return;
            if (saved.style === null) stoneShell.removeAttribute('style');
            else stoneShell.setAttribute('style', saved.style);
            blackPortalMatch = null;
            applyMobileViewport();
          };"""
          new = """const finishBlackPortalRestore = saved => {
            if (!saved) return;
            if (saved.style === null) stoneShell.removeAttribute('style');
            else stoneShell.setAttribute('style', saved.style);
            const restoredTransition = stoneShell.style.getPropertyValue('transition');
            const restoredTransitionPriority = stoneShell.style.getPropertyPriority('transition');
            stoneShell.style.setProperty('transition', 'none', 'important');
            blackPortalMatch = null;
            applyMobileViewport();
            stoneShell.getBoundingClientRect();
            if (restoredTransition) {
              stoneShell.style.setProperty('transition', restoredTransition, restoredTransitionPriority);
            } else {
              stoneShell.style.removeProperty('transition');
            }
          };"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one restore anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify focused change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          required = [
              "stoneShell.style.setProperty('transition', 'none', 'important');",
              "stoneShell.getBoundingClientRect();",
              "stoneShell.style.removeProperty('transition');"
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing expected restore guard: {item}')
          if text.count('const finishBlackPortalRestore = saved => {') != 1:
              raise SystemExit('Unexpected duplicate finishBlackPortalRestore')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-mobile-portal-restore.yml
          git add index.html
          git commit -m 'Fix mobile portal restore jump'
          git push
