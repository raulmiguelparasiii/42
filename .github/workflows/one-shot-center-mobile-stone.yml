name: One-shot center mobile Stone
on:
  push:
    paths:
      - '.github/workflows/one-shot-center-mobile-stone.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Center mobile Stone shell on viewport
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = (
              "      #stone-shell {\n"
              "        width: min(108.8vw, 64vh);\n"
              "        touch-action: none;\n"
              "        --mobile-pan-x: 0px;\n"
              "        --mobile-pan-y: 0px;\n"
              "        --mobile-scale: 1;\n"
              "        --mobile-mode-y: 0px;\n"
              "        transform:\n"
              "          translate3d(\n"
              "            var(--mobile-pan-x),\n"
              "            calc(var(--mobile-pan-y) + var(--mobile-mode-y)),\n"
              "            0\n"
              "          )\n"
              "          scale(var(--mobile-scale));\n"
              "        transform-origin: center center;\n"
              "      }\n"
          )
          new = (
              "      #stone-shell {\n"
              "        position: fixed;\n"
              "        left: 50vw;\n"
              "        top: 50dvh;\n"
              "        width: min(108.8vw, 64vh);\n"
              "        touch-action: none;\n"
              "        --mobile-pan-x: 0px;\n"
              "        --mobile-pan-y: 0px;\n"
              "        --mobile-scale: 1;\n"
              "        --mobile-mode-y: 0px;\n"
              "        transform:\n"
              "          translate3d(\n"
              "            calc(-50% + var(--mobile-pan-x)),\n"
              "            calc(-50% + var(--mobile-pan-y) + var(--mobile-mode-y)),\n"
              "            0\n"
              "          )\n"
              "          scale(var(--mobile-scale));\n"
              "        transform-origin: center center;\n"
              "      }\n"
          )
          if s.count(old) != 1:
              raise SystemExit(f'Expected one mobile Stone block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-center-mobile-stone.yml
          git add index.html
          git commit -m 'Center black structure on mobile viewport'
          git push
