name: One-shot center mobile Stone
on:
  push:
    paths:
      - '.github/workflows/one-shot-center-mobile-stone.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Center mobile Stone shell on viewport
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''      #stone-shell {
        width: min(108.8vw, 64vh);
        touch-action: none;
        --mobile-pan-x: 0px;
        --mobile-pan-y: 0px;
        --mobile-scale: 1;
        --mobile-mode-y: 0px;
        transform:
          translate3d(
            var(--mobile-pan-x),
            calc(var(--mobile-pan-y) + var(--mobile-mode-y)),
            0
          )
          scale(var(--mobile-scale));
        transform-origin: center center;
      }
'''
          new = '''      #stone-shell {
        position: fixed;
        left: 50vw;
        top: 50dvh;
        width: min(108.8vw, 64vh);
        touch-action: none;
        --mobile-pan-x: 0px;
        --mobile-pan-y: 0px;
        --mobile-scale: 1;
        --mobile-mode-y: 0px;
        transform:
          translate3d(
            calc(-50% + var(--mobile-pan-x)),
            calc(-50% + var(--mobile-pan-y) + var(--mobile-mode-y)),
            0
          )
          scale(var(--mobile-scale));
        transform-origin: center center;
      }
'''
          if old not in s:
              raise SystemExit('Expected mobile Stone block not found; refusing broad edit')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-center-mobile-stone.yml
          git add index.html
          git commit -m 'Center black structure on mobile viewport'
          git push
