name: One-shot portal readiness fix
on:
  push:
    paths:
      - '.github/workflows/one-shot-portal-readiness-fix.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply readiness patch
        run: python3 .github/patch-readiness.py
      - name: Validate patched source
        run: |
          grep -F "let atlasBootPromise = null;" index.html
          grep -F "await registration.update();" index.html
          grep -F "frame.classList.remove('is-active', 'is-committing');" index.html
          grep -F "portalPreviewFrame.style.opacity = '0';" index.html
      - name: Commit and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep black composition until Atlas is ready'
          git rm .github/patch-readiness.py .github/workflows/one-shot-portal-readiness-fix.yml
          git commit -m 'Remove one-shot Atlas readiness patch files'
          git push
