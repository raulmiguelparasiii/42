name: Refine relation annotations

on:
  push:
    paths:
      - .github/workflows/adjust-relation-annotations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch relation annotations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          text = text.replace('const purposeRelation = {', 'const relationAnnotation = {', 1)
          text = text.replace('purposeRelation.text', 'relationAnnotation.text')
          text = text.replace('purposeRelation.line', 'relationAnnotation.line')

          old = "          const fullMeaningLabel = (label.letter === 'K' || label.letter === 'W') && value.length > 1;\n          const offset = fullMeaningLabel ? 18 : (label.letter === 'M' || label.letter === 'C' ? 12 : 11);"
          new = "          const fullMeaningLabel = (label.letter === 'K' || label.letter === 'W') && value.length > 1;\n          const configuredOffset = config.axisLabelOffsets?.[label.letter];\n          const offset = configuredOffset ?? (fullMeaningLabel ? 18 : (label.letter === 'M' || label.letter === 'C' ? 12 : 11));"
          if old not in text:
              raise SystemExit('axis label offset anchor not found')
          text = text.replace(old, new, 1)

          start = text.index('        if (config.purposeRelation) {')
          end = text.index('\n\n        let personAnchor = null;', start)
          old_block = text[start:end]
          new_block = """        if (config.relationLabel) {
          const [firstIndex, secondIndex] = axes[config.relationAxis ?? 0];
          const first = points[firstIndex];
          const second = points[secondIndex];
          const midX = (first[0] + second[0]) / 2;
          const midY = (first[1] + second[1]) / 2;
          const dx = first[0] - second[0];
          const dy = first[1] - second[1];
          const length = Math.max(Math.hypot(dx, dy), 0.001);
          const side = config.relationSide ?? 1;
          const nx = (-dy / length) * side;
          const ny = (dx / length) * side;
          const labelDistance = config.relationLabelDistance ?? 24;
          const lineEndGap = 7;
          const labelX = midX + nx * labelDistance;
          const labelY = midY + ny * labelDistance;
          const lineEndX = labelX - nx * lineEndGap;
          const lineEndY = labelY - ny * lineEndGap;

          relationAnnotation.text.textContent = config.relationLabel;
          relationAnnotation.line.setAttribute('x1', midX);
          relationAnnotation.line.setAttribute('y1', midY);
          relationAnnotation.line.setAttribute('x2', lineEndX);
          relationAnnotation.line.setAttribute('y2', lineEndY);
          relationAnnotation.line.style.opacity = '1';

          relationAnnotation.text.setAttribute('x', labelX);
          relationAnnotation.text.setAttribute('y', labelY);
          relationAnnotation.text.style.opacity = '1';
        }"""
          text = text[:start] + new_block + text[end:]

          text = text.replace("            purposeRelation: true,\n            header: 'Purpose',", "            axisLabelOffsets: { E: 24, P: 24 },\n            relationLabel: 'Purpose', relationAxis: 0,\n            header: 'Purpose',", 2)

          old = """          'full-meaning': {
            axes: [0, 1, 2], verticalMode: 'full', edges: true, emphasize: [2], focusAxes: true, dimEdges: true,
            header: 'Meaning',
            subtext: 'Information and interpretation.',
            markers: [[0, 0, -1], [0, 0, 1]]
          },
          'full-accountability': {
            axes: [0, 1, 2], verticalMode: 'full', edges: true, emphasize: [1], focusAxes: true, dimEdges: true,
            header: 'Accountability',
            subtext: 'Whether reality can govern and correct the organization.',
            markers: [[0, 1, 0]]
          },"""
          new = """          'full-meaning': {
            axes: [0, 1, 2], verticalMode: 'full', edges: true, emphasize: [2], focusAxes: true, dimEdges: true,
            axisLabels: { K: 'Information', W: 'Interpretation' },
            axisLabelOffsets: { K: 24, W: 24 },
            relationLabel: 'Meaning', relationAxis: 2,
            header: 'Meaning',
            subtext: 'Information and interpretation.',
            markers: [[0, 0, -1], [0, 0, 1]]
          },
          'full-accountability': {
            axes: [0, 1, 2], verticalMode: 'full', edges: true, emphasize: [1], focusAxes: true, dimEdges: true,
            axisLabels: { M: 'Answerability', C: 'Insulation' },
            axisLabelOffsets: { M: 20, C: 20 },
            relationLabel: 'Accountability', relationAxis: 1,
            header: 'Accountability',
            subtext: 'Whether reality can govern and correct the organization.',
            markers: [[0, 1, 0], [0, -1, 0]]
          },"""
          if old not in text:
              raise SystemExit('full relation scene anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine explainer relation annotations"
          git push
