name: Refine relation annotations

on:
  push:
    paths:
      - .github/workflows/adjust-relation-annotations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch relation annotations
        run: echo '' | base64 --decode > /tmp/patch.py && python3 /tmp/patch.py
      - name: Validate and commit
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const s=h.split('<script>')[1].split('</script>')[0];new Function(s);"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine explainer relation annotations"
          git push
