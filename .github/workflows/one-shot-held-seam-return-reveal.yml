name: One-shot held seam return reveal
on:
  push:
    paths:
      - '.github/workflows/one-shot-held-seam-return-reveal.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch return dwell overlay controller
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text()

          old = """let blackPortalMatch = null;\nlet atlasActivationTimer = 0;"""
          new = """let blackPortalMatch = null;\nlet atlasActivationTimer = 0;\nlet blackReturnOverlayProgress = 0;"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """      const mainOverlay = make('g', 'main-overlay');\n      svg.appendChild(mainOverlay);"""
          new = """      const mainOverlay = make('g', 'main-overlay');\n      svg.appendChild(mainOverlay);\n\n      const mainReturnRevealDefs = make('defs');\n      const mainReturnRevealGradient = make('radialGradient');\n      mainReturnRevealGradient.setAttribute('id', 'main-return-reveal-gradient');\n      const mainReturnRevealInner = make('stop');\n      mainReturnRevealInner.setAttribute('offset', '0%');\n      mainReturnRevealInner.setAttribute('stop-color', '#fff');\n      const mainReturnRevealFeather = make('stop');\n      mainReturnRevealFeather.setAttribute('offset', '84%');\n      mainReturnRevealFeather.setAttribute('stop-color', '#fff');\n      const mainReturnRevealEdge = make('stop');\n      mainReturnRevealEdge.setAttribute('offset', '100%');\n      mainReturnRevealEdge.setAttribute('stop-color', '#000');\n      mainReturnRevealGradient.append(\n        mainReturnRevealInner,\n        mainReturnRevealFeather,\n        mainReturnRevealEdge\n      );\n      const mainReturnRevealMask = make('mask');\n      mainReturnRevealMask.setAttribute('id', 'main-return-reveal-mask');\n      mainReturnRevealMask.setAttribute('maskUnits', 'userSpaceOnUse');\n      mainReturnRevealMask.setAttribute('x', '-180');\n      mainReturnRevealMask.setAttribute('y', '-180');\n      mainReturnRevealMask.setAttribute('width', '360');\n      mainReturnRevealMask.setAttribute('height', '360');\n      const mainReturnRevealCircle = make('circle');\n      mainReturnRevealCircle.setAttribute('cx', '0');\n      mainReturnRevealCircle.setAttribute('cy', '0');\n      mainReturnRevealCircle.setAttribute('r', '0');\n      mainReturnRevealCircle.style.fill = 'url(#main-return-reveal-gradient)';\n      mainReturnRevealCircle.style.stroke = 'none';\n      mainReturnRevealMask.appendChild(mainReturnRevealCircle);\n      mainReturnRevealDefs.append(mainReturnRevealGradient, mainReturnRevealMask);\n      svg.insertBefore(mainReturnRevealDefs, svg.firstChild);"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """  atlasPortalState = state;\n  syncBlackFromAtlas(state);\n  compositionMode = 'black';"""
          new = """  atlasPortalState = state;\n  blackReturnOverlayProgress = Math.max(\n    blackReturnOverlayProgress,\n    clamp(Number(state?.returnDwellProgress) || 0, 0, 1)\n  );\n  syncBlackFromAtlas(state);\n  compositionMode = 'black';"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """  setTimeout(() => {\n    frame?.classList.remove('is-committing');\n    portalTransitioning = false;\n  }, 300);"""
          new = """  setTimeout(() => {\n    frame?.classList.remove('is-committing');\n    portalTransitioning = false;\n    blackReturnOverlayProgress = 0;\n  }, 300);"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """  const state = atlasPortalState;\n  const rawAmount = Number(state?.returnAmount);\n  const amount = Number.isFinite(rawAmount) ? clamp(rawAmount, 0, 1) : 0;"""
          new = """  const state = atlasPortalState;\n  const rawAmount = Number(state?.returnAmount);\n  const amount = Number.isFinite(rawAmount) ? clamp(rawAmount, 0, 1) : 0;\n  const rawDwell = Number(state?.returnDwellProgress);\n  blackReturnOverlayProgress = Number.isFinite(rawDwell)\n    ? clamp(rawDwell, 0, 1)\n    : 0;"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """  if (data.type === 'stone-atlas-cancel') {\n    atlasPointerActive = false;"""
          new = """  if (data.type === 'stone-atlas-cancel') {\n    atlasPointerActive = false;\n    blackReturnOverlayProgress = 0;"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = """        const mainOpacity = (explainer.active || compositionMode === 'atlas' || portalTransitioning)\n          ? 0\n          : clamp(1 - mainDistance / 0.16, 0, 1) * motionFactor;\n\n        const maxRadius = Math.max(...points.map(point => Math.hypot(point[0], point[1])));"""
          new = """        const returnRevealActive =\n          blackReturnOverlayProgress > 0 &&\n          (compositionMode === 'atlas' || portalTransitioning);\n        const returnReveal = returnRevealActive\n          ? clamp(blackReturnOverlayProgress, 0, 1)\n          : 0;\n        const standardMainOpacity = (explainer.active || compositionMode === 'atlas' || portalTransitioning)\n          ? 0\n          : clamp(1 - mainDistance / 0.16, 0, 1) * motionFactor;\n        const mainOpacity = returnRevealActive\n          ? smoothstep(clamp(returnReveal * 1.15, 0, 1))\n          : standardMainOpacity;\n\n        if (returnRevealActive) {\n          mainReturnRevealCircle.setAttribute('r', String(150 * smoothstep(returnReveal)));\n          outerRing.setAttribute('mask', 'url(#main-return-reveal-mask)');\n          mainOverlay.setAttribute('mask', 'url(#main-return-reveal-mask)');\n        } else {\n          mainReturnRevealCircle.setAttribute('r', '0');\n          outerRing.removeAttribute('mask');\n          mainOverlay.removeAttribute('mask');\n        }\n\n        const maxRadius = Math.max(...points.map(point => Math.hypot(point[0], point[1])));"""
          assert s.count(old) == 1
          s = s.replace(old, new)

          path.write_text(s)

          agents = Path('AGENTS.md')
          a = agents.read_text()
          old = """- A hidden black→white composition doorway to the Philosopher’s Stone Atlas uses the exact vertically mirrored orientation yaw π/4, pitch −asin(1/√3); it is deliberately not a fifth magnetic snap. The browser stays on the current `/42/` page. An 8° outer window lazily preloads the Atlas; inside the final 4°, its Stone is synchronized to the black Stone’s exact projected pose and crossfaded up to 52%. The seam uses a near-orthographic 1.15° perspective lens only for geometric continuity. Releasing inside the doorway commits without navigation; over about 0.9 s the Atlas Stone moves into its native layout/orientation while its camera continuously returns to the native 45° perspective, without blocking interaction. Returning to black no longer uses a fixed reciprocal doorway: a deliberate fast Atlas throw above the normal snap range arms a momentum-preserving capture. Native angular momentum continues to decay while a gentle attraction increasingly pulls the Stone toward the exact quaternion corresponding to the black main view yaw π/4, pitch +asin(1/√3). During the final 12° the bare black wireframe progressively appears and the Atlas lens flattens back toward the seam; touching again cancels the capture. Once the exact return view remains untouched for one second, the white composition yields to black and the Stone slides into `/42/`’s native framing before ordinary black overlays reappear."""
          new = """- A hidden black→white composition doorway to the Philosopher’s Stone Atlas uses the exact vertically mirrored orientation yaw π/4, pitch −asin(1/√3); it is deliberately not a fifth magnetic snap. The browser stays on the current `/42/` page. An 8° outer window lazily preloads the Atlas; inside the final 4°, its Stone is synchronized to the black Stone’s exact projected pose and crossfaded up to 52%. The seam uses a near-orthographic 1.15° perspective lens only for geometric continuity. Releasing inside the doorway commits without navigation into a held white seam: the Atlas Stone remains in the black Stone’s exact orientation/framing while Atlas chrome stays hidden until the first new Atlas interaction; only then does it transition over about 0.9 s into its native layout/orientation and 45° perspective without blocking the interaction. Returning to black no longer uses a fixed reciprocal doorway: a deliberate fast Atlas throw above the normal snap range arms a momentum-preserving capture. Native angular momentum continues to decay while a gentle attraction increasingly pulls the Stone toward the exact quaternion corresponding to the black main view yaw π/4, pitch +asin(1/√3). During the final 12° the bare black wireframe progressively appears and the Atlas lens flattens back toward the seam; touching again cancels the capture. Once the exact return view is reached, a two-second untouched dwell begins; across that dwell the default black overlay reveals radially outward from the center, and at completion the white composition yields to black while the Stone slides into `/42/`’s native framing."""
          assert a.count(old) == 1
          a = a.replace(old, new)
          agents.write_text(a)
      - name: Validate patch
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          a=Path('AGENTS.md').read_text()
          checks=[
            'blackReturnOverlayProgress = 0',
            "main-return-reveal-mask",
            "150 * smoothstep(returnReveal)",
            "returnDwellProgress",
            "blackReturnOverlayProgress = Number.isFinite(rawDwell)",
          ]
          for x in checks:
            assert x in s, x
          assert 'two-second untouched dwell' in a
          assert s.count('main-return-reveal-mask') >= 3
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/one-shot-held-seam-return-reveal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html AGENTS.md .github/workflows/one-shot-held-seam-return-reveal.yml
          git commit -m 'Reveal main overlay during return dwell'
          git push
