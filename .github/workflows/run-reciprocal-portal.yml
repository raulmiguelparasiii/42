name: Run corrected reciprocal Stone portal patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-reciprocal-portal.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrected existing patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/one-shot-reciprocal-portal-v2.yml')
          raw = source.read_text()
          marker = "          python - <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY", start)
          script = textwrap.dedent(raw[start:end])

          old = "s=once(s,'    #stone-shell {\\n',portal_css+'    #stone-shell {\\n','portal CSS insertion')"
          new = """anchor='    #stone-shell {\\n'\nif anchor not in s:\n    raise SystemExit('portal CSS insertion: anchor missing')\ns=s.replace(anchor,portal_css+anchor,1)"""
          if script.count(old) != 1:
              raise SystemExit('executor could not find the known CSS insertion line')
          script = script.replace(old, new, 1)
          exec(compile(script, 'reciprocal-portal-patch.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Commit implementation and remove patch scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-reciprocal-portal-v2.yml .github/workflows/run-reciprocal-portal.yml
          git add index.html AGENTS.md
          git diff --cached --check
          git commit -m "Add hidden reciprocal atlas portal"
          git push
