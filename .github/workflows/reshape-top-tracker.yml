name: Reshape top tracker

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tracker motion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          text = index_path.read_text()

          start = text.index("      const TOP_TRACKER_CORNERS = [")
          end_marker = "      let topTrackerTime = 0;"
          end = text.index(end_marker, start) + len(end_marker)
          new_constants = "      const TOP_TRACKER_LOBES = [\n        { x: 0, z: -1, direction: 1 },\n        { x: 0, z: 1, direction: -1 },\n        { x: 1, z: 0, direction: -1 },\n        { x: -1, z: 0, direction: 1 }\n      ];\n      const TOP_TRACKER_LOOP = 10.8;\n      const TOP_TRACKER_HOLD = 1.8;\n      const TOP_TRACKER_PHASE = TOP_TRACKER_LOOP + TOP_TRACKER_HOLD;\n      const TOP_TRACKER_CYCLE = TOP_TRACKER_PHASE * TOP_TRACKER_LOBES.length;\n      let topTrackerTime = 0;"
          text = text[:start] + new_constants + text[end:]

          start = text.index("      const topTrackerState = () => {")
          end = text.index("\n\n      const topTrackerReading = state => {", start)
          new_state = "      const topTrackerState = () => {\n        if (reduceMotion) return { x: 0, z: 0, mature: true };\n\n        const phaseIndex = Math.floor(topTrackerTime / TOP_TRACKER_PHASE) % TOP_TRACKER_LOBES.length;\n        const localTime = topTrackerTime % TOP_TRACKER_PHASE;\n        if (localTime >= TOP_TRACKER_LOOP) {\n          return { x: 0, z: 0, mature: true };\n        }\n\n        const lobe = TOP_TRACKER_LOBES[phaseIndex];\n        const t = localTime / TOP_TRACKER_LOOP;\n        const theta = lobe.direction * Math.PI * 2 * t;\n        const centerX = lobe.x * 0.5;\n        const centerZ = lobe.z * 0.5;\n        const radialX = -centerX;\n        const radialZ = -centerZ;\n        let x = centerX + radialX * Math.cos(theta) - radialZ * Math.sin(theta);\n        let z = centerZ + radialX * Math.sin(theta) + radialZ * Math.cos(theta);\n\n        const l1 = Math.abs(x) + Math.abs(z);\n        if (l1 > 1) {\n          x /= l1;\n          z /= l1;\n        }\n\n        return { x, z, mature: false };\n      };"
          text = text[:start] + new_state + text[end:]
          index_path.write_text(text)

          agents_path = Path('AGENTS.md')
          lines = agents_path.read_text().splitlines()
          prefix = '- Set-angle overlays fade in only as motion becomes slow and an anchor is approached.'
          replacement = '- Set-angle overlays fade in only as motion becomes slow and an anchor is approached. The detailed ring overlay appears only at the main anchor. The top anchor labels Knowledge, Empathy, Practicality, and Wisdom at their projected endpoints and includes a non-interactive animated stance tracker on the top L1 surface: a red point, dim screen-horizontal/screen-vertical crosshair, and a larger reading above the interface. Its motion is a four-petal rosette sharing M, not a spoke plus a small endpoint orbit. Each lobe starts and ends at M and traverses the adjacent paired points plus its endpoint: Knowledge CCW is M→P+K→K→K+E→M; Wisdom CW is M→P+W→W→E+W→M; Empathy CW is M→E+W→E→E+K→M; Practicality CCW is M→P+W→P→P+K→M. The underlying circular lobes are constrained to |x|+|z|≤1 so the point remains on y=1−|x|−|z|, with a brief exact-M hold between petals. The eight noncentral readings crossfade by angular position between the four single-function and four paired-function strings; `maturity` appears only at the exact center snap. Reduced-motion mode holds the tracker at Maturity.'
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f'AGENTS tracker paragraph count: {len(matches)}')
          lines[matches[0]] = replacement
          agents_path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('script block missing');
          new Function(match[1]);
          if (!html.includes('TOP_TRACKER_LOBES')) throw new Error('lobe tracker missing');
          if (html.includes('TOP_TRACKER_DEPART')) throw new Error('old spoke tracker remains');
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html AGENTS.md
          git commit -m "Shape top tracker as four-petal loop"
          git push
