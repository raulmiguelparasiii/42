name: Reshape top tracker

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tracker motion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count: {count}')
              return text.replace(old, new, 1)

          index_path = Path('index.html')
          text = index_path.read_text()

          old_constants = """      const TOP_TRACKER_CORNERS = [
        { x: 0, z: -1, direction: -1 },
        { x: 0, z: 1, direction: 1 },
        { x: 1, z: 0, direction: 1 },
        { x: -1, z: 0, direction: -1 }
      ];
      const TOP_TRACKER_DEPART = 2.2;
      const TOP_TRACKER_ORBIT = 7.2;
      const TOP_TRACKER_RETURN = 2.8;
      const TOP_TRACKER_HOLD = 1.8;
      const TOP_TRACKER_PHASE = TOP_TRACKER_DEPART + TOP_TRACKER_ORBIT + TOP_TRACKER_RETURN + TOP_TRACKER_HOLD;
      const TOP_TRACKER_CYCLE = TOP_TRACKER_PHASE * TOP_TRACKER_CORNERS.length;
      let topTrackerTime = 0;"""

          new_constants = """      const TOP_TRACKER_LOBES = [
        { x: 0, z: -1, direction: 1 },
        { x: 0, z: 1, direction: -1 },
        { x: 1, z: 0, direction: -1 },
        { x: -1, z: 0, direction: 1 }
      ];
      const TOP_TRACKER_LOOP = 10.8;
      const TOP_TRACKER_HOLD = 1.8;
      const TOP_TRACKER_PHASE = TOP_TRACKER_LOOP + TOP_TRACKER_HOLD;
      const TOP_TRACKER_CYCLE = TOP_TRACKER_PHASE * TOP_TRACKER_LOBES.length;
      let topTrackerTime = 0;"""

          text = replace_once(text, old_constants, new_constants, 'tracker constants')

          start = text.index("      const topTrackerState = () => {")
          end = text.index("\n\n      const topTrackerReading = state => {", start)
          if start < 0 or end < 0:
              raise SystemExit('tracker state boundaries not found')

          new_state = """      const topTrackerState = () => {
        if (reduceMotion) return { x: 0, z: 0, mature: true };

        const phaseIndex = Math.floor(topTrackerTime / TOP_TRACKER_PHASE) % TOP_TRACKER_LOBES.length;
        const localTime = topTrackerTime % TOP_TRACKER_PHASE;
        if (localTime >= TOP_TRACKER_LOOP) {
          return { x: 0, z: 0, mature: true };
        }

        const lobe = TOP_TRACKER_LOBES[phaseIndex];
        const t = localTime / TOP_TRACKER_LOOP;
        const theta = lobe.direction * Math.PI * 2 * t;
        const centerX = lobe.x * 0.5;
        const centerZ = lobe.z * 0.5;
        const radialX = -centerX;
        const radialZ = -centerZ;
        let x = centerX + radialX * Math.cos(theta) - radialZ * Math.sin(theta);
        let z = centerZ + radialX * Math.sin(theta) + radialZ * Math.cos(theta);

        const l1 = Math.abs(x) + Math.abs(z);
        if (l1 > 1) {
          x /= l1;
          z /= l1;
        }

        return { x, z, mature: false };
      };"""
          text = text[:start] + new_state + text[end:]
          index_path.write_text(text)

          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text()
          old_agents = """- Set-angle overlays fade in only as motion becomes slow and an anchor is approached. The detailed ring overlay appears only at the main anchor. The top anchor labels Knowledge, Empathy, Practicality, and Wisdom at their projected endpoints and now includes a non-interactive animated stance tracker on the top L1 surface: a red point, dim screen-horizontal/screen-vertical crosshair, and a larger reading above the interface. The point stays on y=1−|x|−|z|, cycles symmetrically through Knowledge CCW → Maturity → Wisdom CW → Maturity → Empathy CW → Maturity → Practicality CCW → Maturity, then repeats. The eight noncentral readings crossfade by angular position between the four single-function and four paired-function strings; `maturity` appears only at the exact center snap. Reduced-motion mode holds the tracker at Maturity."""
          new_agents = """- Set-angle overlays fade in only as motion becomes slow and an anchor is approached. The detailed ring overlay appears only at the main anchor. The top anchor labels Knowledge, Empathy, Practicality, and Wisdom at their projected endpoints and includes a non-interactive animated stance tracker on the top L1 surface: a red point, dim screen-horizontal/screen-vertical crosshair, and a larger reading above the interface. Its motion is a four-petal rosette sharing M, not a spoke plus a small endpoint orbit. Each lobe starts and ends at M and traverses the adjacent paired points plus its endpoint: Knowledge CCW is M→P+K→K→K+E→M; Wisdom CW is M→P+W→W→E+W→M; Empathy CW is M→E+W→E→E+K→M; Practicality CCW is M→P+W→P→P+K→M. The underlying circular lobes are constrained to |x|+|z|≤1 so the point remains on y=1−|x|−|z|, with a brief exact-M hold between petals. The eight noncentral readings crossfade by angular position between the four single-function and four paired-function strings; `maturity` appears only at the exact center snap. Reduced-motion mode holds the tracker at Maturity."""
          agents = replace_once(agents, old_agents, new_agents, 'AGENTS tracker description')
          agents_path.write_text(agents)
          PY
      - name: Validate and commit
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('script block missing');
          new Function(match[1]);
          if (!html.includes('TOP_TRACKER_LOBES')) throw new Error('lobe tracker missing');
          if (html.includes('TOP_TRACKER_DEPART')) throw new Error('old spoke tracker remains');
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html AGENTS.md
          git commit -m "Shape top tracker as four-petal loop"
          git push
