name: Add top-view stance tracker

on:
  push:
    paths:
      - .github/workflows/add-top-stance-tracker.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch top-view interface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count: {count}')
              return text.replace(old, new, 1)

          path = Path('index.html')
          text = path.read_text()

          text = replace_once(
              text,
              '''    #octahedron .top-concept {
      fill: #fff;
      stroke: none;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      font: 4.4px Georgia, "Times New Roman", serif;
      letter-spacing: 0.28px;
    }
    #octahedron .explainer-marker {''',
              '''    #octahedron .top-concept {
      fill: #fff;
      stroke: none;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      font: 4.4px Georgia, "Times New Roman", serif;
      letter-spacing: 0.28px;
    }
    #octahedron .top-tracker-crosshair {
      stroke: rgba(255,255,255,.28);
      stroke-width: .68;
      fill: none;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }
    #octahedron .top-tracker-dot {
      fill: #ff3b30;
      stroke: none;
      pointer-events: none;
    }
    #octahedron .top-tracker-reading {
      fill: #fff;
      stroke: none;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      font: 600 6.6px Georgia, "Times New Roman", serif;
      letter-spacing: .12px;
    }
    #octahedron .explainer-marker {''',
              'top tracker css'
          )

          text = replace_once(
              text,
              '''      #octahedron .outer-ring-text { font-size: 5.46px; }
      #octahedron .top-concept { font-size: 5.2px; }
      #app.explainer-active #stone-shell {''',
              '''      #octahedron .outer-ring-text { font-size: 5.46px; }
      #octahedron .top-concept { font-size: 5.2px; }
      #octahedron .top-tracker-reading { font-size: 7.4px; }
      #app.explainer-active #stone-shell {''',
              'mobile tracker font'
          )

          text = replace_once(
              text,
              '''      const topOverlay = make('g', 'top-overlay');
      topOverlay.style.opacity = '0';
      svg.appendChild(topOverlay);
      const topConcepts = [''',
              '''      const topOverlay = make('g', 'top-overlay');
      topOverlay.style.opacity = '0';
      svg.appendChild(topOverlay);

      const topTrackerGroup = make('g', 'top-tracker');
      const topTrackerHorizontal = make('line', 'top-tracker-crosshair');
      const topTrackerVertical = make('line', 'top-tracker-crosshair');
      const topTrackerDot = make('circle', 'top-tracker-dot');
      const topTrackerReadings = [
        make('text', 'top-tracker-reading'),
        make('text', 'top-tracker-reading')
      ];
      topTrackerDot.setAttribute('r', '2.35');
      topTrackerGroup.appendChild(topTrackerHorizontal);
      topTrackerGroup.appendChild(topTrackerVertical);
      topTrackerGroup.appendChild(topTrackerDot);
      topTrackerReadings.forEach(node => topTrackerGroup.appendChild(node));
      topOverlay.appendChild(topTrackerGroup);

      const topConcepts = [''',
              'top tracker nodes'
          )

          text = replace_once(
              text,
              '''      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const mobileGestureMedia = matchMedia('(max-width: 700px)');''',
              '''      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const mobileGestureMedia = matchMedia('(max-width: 700px)');
      const TOP_TRACKER_READINGS = [
        'empathy over kpw',
        'empathy + wisdom over p & k',
        'wisdom over epk',
        'practicality + wisdom over e & k',
        'practicality over ekw',
        'practicality + knowledge over e & w',
        'knowledge over epw',
        'empathy + knowledge over p & w'
      ];
      const TOP_TRACKER_CORNERS = [
        { x: 0, z: -1, direction: -1 },
        { x: 0, z: 1, direction: 1 },
        { x: 1, z: 0, direction: 1 },
        { x: -1, z: 0, direction: -1 }
      ];
      const TOP_TRACKER_DEPART = 2.2;
      const TOP_TRACKER_ORBIT = 7.2;
      const TOP_TRACKER_RETURN = 2.8;
      const TOP_TRACKER_HOLD = 1.8;
      const TOP_TRACKER_PHASE = TOP_TRACKER_DEPART + TOP_TRACKER_ORBIT + TOP_TRACKER_RETURN + TOP_TRACKER_HOLD;
      const TOP_TRACKER_CYCLE = TOP_TRACKER_PHASE * TOP_TRACKER_CORNERS.length;
      let topTrackerTime = 0;''',
              'top tracker timing'
          )

          text = replace_once(
              text,
              '''      const wrap = angle => Math.atan2(Math.sin(angle), Math.cos(angle));
      const deltaYaw = target => wrap(target - yaw);
      const distanceTo = target => Math.hypot(deltaYaw(target.yaw), target.pitch - pitch);

      const applyMobileViewport = () => {''',
              '''      const wrap = angle => Math.atan2(Math.sin(angle), Math.cos(angle));
      const deltaYaw = target => wrap(target - yaw);
      const distanceTo = target => Math.hypot(deltaYaw(target.yaw), target.pitch - pitch);
      const smoothstep = value => value * value * (3 - 2 * value);

      const topTrackerState = () => {
        if (reduceMotion) return { x: 0, z: 0, mature: true };

        const phaseIndex = Math.floor(topTrackerTime / TOP_TRACKER_PHASE) % TOP_TRACKER_CORNERS.length;
        const localTime = topTrackerTime % TOP_TRACKER_PHASE;
        const corner = TOP_TRACKER_CORNERS[phaseIndex];
        const tangent = { x: -corner.z, z: corner.x };
        const orbitPoint = theta => ({
          x: corner.x * (0.78 + 0.08 * Math.cos(theta)) + tangent.x * 0.13 * Math.sin(theta),
          z: corner.z * (0.78 + 0.08 * Math.cos(theta)) + tangent.z * 0.13 * Math.sin(theta)
        });
        const start = orbitPoint(0);

        if (localTime < TOP_TRACKER_DEPART) {
          const t = smoothstep(localTime / TOP_TRACKER_DEPART);
          return { x: start.x * t, z: start.z * t, mature: localTime === 0 };
        }

        if (localTime < TOP_TRACKER_DEPART + TOP_TRACKER_ORBIT) {
          const t = (localTime - TOP_TRACKER_DEPART) / TOP_TRACKER_ORBIT;
          const point = orbitPoint(corner.direction * Math.PI * 2 * t);
          return { ...point, mature: false };
        }

        if (localTime < TOP_TRACKER_DEPART + TOP_TRACKER_ORBIT + TOP_TRACKER_RETURN) {
          const t = smoothstep(
            (localTime - TOP_TRACKER_DEPART - TOP_TRACKER_ORBIT) / TOP_TRACKER_RETURN
          );
          return { x: start.x * (1 - t), z: start.z * (1 - t), mature: false };
        }

        return { x: 0, z: 0, mature: true };
      };

      const topTrackerReading = state => {
        if (state.mature || Math.hypot(state.x, state.z) < 1e-6) {
          return { first: 'maturity', second: '', mix: 0 };
        }
        const angle = (Math.atan2(state.z, state.x) + Math.PI * 2) % (Math.PI * 2);
        const sector = angle / (Math.PI / 4);
        const firstIndex = Math.floor(sector) % TOP_TRACKER_READINGS.length;
        const secondIndex = (firstIndex + 1) % TOP_TRACKER_READINGS.length;
        const mix = smoothstep(sector - Math.floor(sector));
        return {
          first: TOP_TRACKER_READINGS[firstIndex],
          second: TOP_TRACKER_READINGS[secondIndex],
          mix
        };
      };

      const applyMobileViewport = () => {''',
              'top tracker state'
          )

          text = replace_once(
              text,
              '''        if (opacity <= 0.001) return;
        topConcepts.forEach(item => {
          const point = points[item.vertex];
          const length = Math.hypot(point[0], point[1]) || 1;
          const ux = point[0] / length;
          const uy = point[1] / length;
          item.node.setAttribute('x', point[0] + ux * 10);
          item.node.setAttribute('y', point[1] + uy * 10);
        });
      };''',
              '''        if (opacity <= 0.001) return;
        topConcepts.forEach(item => {
          const point = points[item.vertex];
          const length = Math.hypot(point[0], point[1]) || 1;
          const ux = point[0] / length;
          const uy = point[1] / length;
          item.node.setAttribute('x', point[0] + ux * 10);
          item.node.setAttribute('y', point[1] + uy * 10);
        });

        const state = topTrackerState();
        const stance = [state.x, 1 - Math.abs(state.x) - Math.abs(state.z), state.z];
        const dot = project(rotate(stance));
        const topPoints = [points[0], points[1], points[4], points[5]];
        const minX = Math.min(...topPoints.map(point => point[0]));
        const maxX = Math.max(...topPoints.map(point => point[0]));
        const minY = Math.min(...topPoints.map(point => point[1]));
        const maxY = Math.max(...topPoints.map(point => point[1]));

        topTrackerHorizontal.setAttribute('x1', minX);
        topTrackerHorizontal.setAttribute('y1', dot[1]);
        topTrackerHorizontal.setAttribute('x2', maxX);
        topTrackerHorizontal.setAttribute('y2', dot[1]);
        topTrackerVertical.setAttribute('x1', dot[0]);
        topTrackerVertical.setAttribute('y1', minY);
        topTrackerVertical.setAttribute('x2', dot[0]);
        topTrackerVertical.setAttribute('y2', maxY);
        topTrackerDot.setAttribute('cx', dot[0]);
        topTrackerDot.setAttribute('cy', dot[1]);

        const reading = topTrackerReading(state);
        const readingX = (minX + maxX) / 2;
        const readingY = minY - 31;
        topTrackerReadings[0].textContent = reading.first;
        topTrackerReadings[0].setAttribute('x', readingX);
        topTrackerReadings[0].setAttribute('y', readingY);
        topTrackerReadings[0].style.opacity = String(1 - reading.mix);
        topTrackerReadings[1].textContent = reading.second;
        topTrackerReadings[1].setAttribute('x', readingX);
        topTrackerReadings[1].setAttribute('y', readingY);
        topTrackerReadings[1].style.opacity = reading.second ? String(reading.mix) : '0';
      };''',
              'draw top tracker'
          )

          text = replace_once(
              text,
              '''        if (explainer.active && !dragging && explainerSceneConfig(explainer.scene).surfaceOrbit) {
          const target = currentExplainerCamera();
          if (target) snapTarget = target;
        }

        settlePhysics(now, dt);''',
              '''        if (explainer.active && !dragging && explainerSceneConfig(explainer.scene).surfaceOrbit) {
          const target = currentExplainerCamera();
          if (target) snapTarget = target;
        }

        const topTrackerActive =
          !explainer.active &&
          !dragging &&
          distanceTo(snaps[1]) < 0.13 &&
          Math.hypot(velocityYaw, velocityPitch) < 0.00135;
        if (topTrackerActive && !reduceMotion) {
          topTrackerTime = (topTrackerTime + dt / 1000) % TOP_TRACKER_CYCLE;
        }

        settlePhysics(now, dt);''',
              'advance top tracker'
          )

          path.write_text(text)
          PY
      - name: Validate and commit
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('script block missing');
          new Function(match[1]);
          if (!html.includes("'knowledge over epw'")) throw new Error('tracker readings missing');
          if (!html.includes("className)")) throw new Error('unexpected source truncation');
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add animated top-view stance tracker"
          git push
