name: One-shot top reading UI patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-top-reading-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch top reading affordance
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          index_path = Path('index.html')
          s = index_path.read_text()

          s = replace_once(
              s,
              '''    #first-principles-panel.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
''',
              '''    #first-principles-panel.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    #first-principles-scroll-hint {
      position: absolute;
      left: 50%;
      bottom: max(28px, calc(env(safe-area-inset-bottom) + 14px));
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 10px solid rgba(255,255,255,.94);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 160ms ease;
    }
    #first-principles-scroll-hint.is-visible {
      opacity: .86;
      animation: first-principles-scroll-hint 1.35s ease-in-out infinite;
    }
    @keyframes first-principles-scroll-hint {
      0%, 100% { transform: translateY(0); opacity: .54; }
      50% { transform: translateY(5px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #first-principles-scroll-hint.is-visible {
        animation: none;
        opacity: .86;
      }
    }
''',
              'scroll hint css'
          )

          s = replace_once(
              s,
              '''    #first-principles-panel .first-principles-law p {
      font: 400 17px/1.92 "Segoe Script", "Brush Script MT", "Apple Chancery", cursive;
      letter-spacing: .01em;
    }
''',
              '''    #first-principles-panel .first-principles-law p {
      font: 400 20px/1.92 "Segoe Script", "Brush Script MT", "Apple Chancery", cursive;
      letter-spacing: .01em;
    }
''',
              'desktop cursive size'
          )

          s = replace_once(
              s,
              '''      #first-principles-panel .first-principles-law p {
        font-size: 16px;
        line-height: 1.9;
      }
''',
              '''      #first-principles-panel .first-principles-law p {
        font-size: 18px;
        line-height: 1.9;
      }
''',
              'mobile cursive size'
          )

          s = replace_once(
              s,
              '''      </div>
    </section>
    <audio id="explainer-audio" preload="metadata" src="script.mp3"></audio>
''',
              '''      </div>
    </section>
    <div id="first-principles-scroll-hint" aria-hidden="true"></div>
    <audio id="explainer-audio" preload="metadata" src="script.mp3"></audio>
''',
              'scroll hint markup'
          )

          s = replace_once(
              s,
              '''      const firstPrinciplesPanel = document.querySelector('#first-principles-panel');
      const explainerHeader = document.querySelector('#explainer-header');
''',
              '''      const firstPrinciplesPanel = document.querySelector('#first-principles-panel');
      const firstPrinciplesScrollHint = document.querySelector('#first-principles-scroll-hint');
      const explainerHeader = document.querySelector('#explainer-header');
''',
              'scroll hint reference'
          )

          s = replace_once(
              s,
              '''      const smoothstep = value => value * value * (3 - 2 * value);
      const snapOverlayOpacity = target => {
''',
              '''      const smoothstep = value => value * value * (3 - 2 * value);
      const updateFirstPrinciplesScrollHint = () => {
        const panelVisible = firstPrinciplesPanel.classList.contains('is-visible');
        const atTop = firstPrinciplesPanel.scrollTop <= 1;
        const hasMoreBelow = firstPrinciplesPanel.scrollHeight > firstPrinciplesPanel.clientHeight + 1;
        firstPrinciplesScrollHint.classList.toggle(
          'is-visible',
          panelVisible && atTop && hasMoreBelow
        );
      };
      const snapOverlayOpacity = target => {
''',
              'scroll hint state'
          )

          s = replace_once(
              s,
              '''          firstPrinciplesPanel.classList.remove('is-visible');
          firstPrinciplesPanel.setAttribute('aria-hidden', 'true');
          return;
''',
              '''          firstPrinciplesPanel.classList.remove('is-visible');
          firstPrinciplesPanel.setAttribute('aria-hidden', 'true');
          updateFirstPrinciplesScrollHint();
          return;
''',
              'explainer hint hide'
          )

          s = replace_once(
              s,
              '''        firstPrinciplesPanel.classList.toggle('is-visible', launchVisible);
        firstPrinciplesPanel.setAttribute('aria-hidden', String(!launchVisible));
        if (opacity <= 0.001) return;
''',
              '''        firstPrinciplesPanel.classList.toggle('is-visible', launchVisible);
        firstPrinciplesPanel.setAttribute('aria-hidden', String(!launchVisible));
        updateFirstPrinciplesScrollHint();
        if (opacity <= 0.001) return;
''',
              'normal hint state'
          )

          s = replace_once(
              s,
              '''      explainerLaunch.addEventListener('click', startExplainer);
''',
              '''      firstPrinciplesPanel.addEventListener('scroll', updateFirstPrinciplesScrollHint, { passive: true });
      explainerLaunch.addEventListener('click', startExplainer);
''',
              'scroll listener'
          )

          index_path.write_text(s)

          agents_path = Path('AGENTS.md')
          a = agents_path.read_text()
          a = replace_once(
              a,
              '''- At the settled top snap, a “The structure in geometry” play control launches the guided geometry explainer. Beneath it, a separate “The structure in first principles” reading panel presents the first-principles argument and a cursive statement of its law. Only the reading panel scrolls vertically; the octahedron/interface remains fixed. Both controls appear only while the top snap is settled, and the reading panel is hidden when the geometry explainer begins.
''',
              '''- At the settled top snap, a “The structure in geometry” play control launches the guided geometry explainer. Beneath it, a separate “The structure in first principles” reading panel presents the first-principles argument and a larger cursive statement of its law for readability. Only the reading panel scrolls vertically; the octahedron/interface remains fixed. A small white down-facing triangle animates at the panel’s bottom center only while the panel is at its true scroll top and more text exists below, disappearing immediately once the reader scrolls. Both controls appear only while the top snap is settled, and the reading panel is hidden when the geometry explainer begins.
''',
              'project memory top panel'
          )
          agents_path.write_text(a)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html AGENTS.md
          git diff --cached --check
          git commit -m "Improve top reading scroll affordance"
          git push
