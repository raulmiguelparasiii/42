name: One-shot top reading UI patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-top-reading-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch top reading affordance
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 -d | python
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html AGENTS.md
          git diff --cached --check
          git commit -m "Improve top reading scroll affordance"
          git push
