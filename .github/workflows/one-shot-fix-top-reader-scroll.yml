name: One-shot repair top reader scrolling
on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-top-reader-scroll.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reader patch
        run: python .github/fix_top_reader_scroll.py
      - name: Commit and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore top-view reader scrolling'
          git rm .github/workflows/one-shot-fix-top-reader-scroll.yml .github/fix_top_reader_scroll.py
          git commit -m 'Remove one-shot top reader patch files'
          git push
