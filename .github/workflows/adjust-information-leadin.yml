name: Adjust information lead-in

on:
  push:
    paths:
      - .github/workflows/adjust-information-leadin.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch explainer lead-in
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Validate and commit
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('script block missing');
          new Function(match[1]);
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html AGENTS.md
          git commit -m "Refine information lead-in visuals"
          git push
