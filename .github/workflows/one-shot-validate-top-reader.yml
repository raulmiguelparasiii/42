name: One-shot validate top reader
on:
  push:
    paths:
      - '.github/workflows/one-shot-validate-top-reader.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise mobile reader scrolling in browser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium
          python -m http.server 8000 >/tmp/reader-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          options=Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=390,844')
          driver=webdriver.Chrome(options=options)
          try:
              driver.get('http://127.0.0.1:8000/')
              wait=WebDriverWait(driver,15)
              panel=wait.until(EC.presence_of_element_located((By.ID,'first-principles-panel')))
              driver.execute_script("arguments[0].classList.add('is-visible'); arguments[0].setAttribute('aria-hidden','false');",panel)
              time.sleep(.1)
              data=driver.execute_script('''
                const p=arguments[0], cs=getComputedStyle(p);
                return {position:cs.position,overflowY:cs.overflowY,touchAction:cs.touchAction,scrollHeight:p.scrollHeight,clientHeight:p.clientHeight,scrollTop:p.scrollTop};
              ''',panel)
              driver.execute_script('arguments[0].scrollTop=Math.min(220, arguments[0].scrollHeight-arguments[0].clientHeight)',panel)
              time.sleep(.15)
              data['scrollTopAfter']=driver.execute_script('return arguments[0].scrollTop',panel)
              data['hintAfter']=driver.execute_script("return document.getElementById('first-principles-scroll-hint')?.classList.contains('is-visible')||false")
              assert data['position']=='fixed', data
              assert data['overflowY'] in ('scroll','auto'), data
              assert data['scrollHeight']>data['clientHeight']+2, data
              assert data['scrollTopAfter']>0, data
              assert data['hintAfter'] is False, data
              print(json.dumps(data,indent=2))
          finally:
              driver.quit()
          PY
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-validate-top-reader.yml
          git commit -m 'Remove one-shot top reader validation workflow'
          git push
