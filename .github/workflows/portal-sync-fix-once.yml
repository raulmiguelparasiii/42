name: Portal synchronization fix once
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portal synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text()

          old = '      transition: opacity 80ms linear;'
          if text.count(old) != 1:
              raise SystemExit(f'base opacity transition count {text.count(old)}')
          text = text.replace(old, '      transition: none;', 1)

          s = text.index('const startAtlasFrameLoad = frame => {')
          e = text.index('const ensurePortalPreview = () => {', s)
          text = text[:s] + """const startAtlasFrameLoad = frame => {
  if (atlasBootPromise) return atlasBootPromise;
  if (
    frame === portalPreviewFrame && frame.isConnected &&
    !frame.hasAttribute('src')
  ) {
    frame.src = ATLAS_URL + '?embedded=1';
  }
  atlasBootPromise = Promise.resolve();
  if (ATLAS_ORIGIN === location.origin) {
    const refresh = () => { refreshAtlasOfflineWorker(); };
    if ('requestIdleCallback' in window) {
      requestIdleCallback(refresh, { timeout: 1800 });
    } else {
      setTimeout(refresh, 0);
    }
  }
  return atlasBootPromise;
};
""" + text[e:]

          s = text.index('const syncAtlasFromBlack = () => {')
          e = text.index('const syncBlackFromAtlas = state => {', s)
          text = text[:s] + """const atlasEmbedBridge = () => {
  if (ATLAS_ORIGIN !== location.origin || !portalPreviewFrame?.contentWindow) return null;
  try {
    return portalPreviewFrame.contentWindow.STONE_EMBED || null;
  } catch {
    return null;
  }
};
let lastBlackPortalSync = null;
const portalRectMatches = (a, b) => Boolean(
  a && b &&
  Math.abs(a.left - b.left) < 0.25 &&
  Math.abs(a.top - b.top) < 0.25 &&
  Math.abs(a.width - b.width) < 0.25 &&
  Math.abs(a.height - b.height) < 0.25
);
const syncAtlasFromBlack = () => {
  if (!atlasReady) return;
  const rect = stoneShellRect();
  if (
    lastBlackPortalSync &&
    Math.abs(wrap(yaw - lastBlackPortalSync.yaw)) < 0.00001 &&
    Math.abs(pitch - lastBlackPortalSync.pitch) < 0.00001 &&
    portalRectMatches(rect, lastBlackPortalSync.rect)
  ) return;
  lastBlackPortalSync = { yaw, pitch, rect };
  const bridge = atlasEmbedBridge();
  try {
    if (bridge?.syncFromBlack?.(yaw, pitch, rect)) return;
  } catch {
    // Fall through to postMessage if same-origin direct access is unavailable.
  }
  postAtlasMessage({
    type: 'stone-composition-sync-from-black',
    yaw,
    pitch,
    rect
  });
};
const cancelBlackPortalPreview = () => {
  if (!blackPreviewActive) return;
  blackPreviewActive = false;
  lastBlackPortalSync = null;
  const bridge = atlasEmbedBridge();
  try {
    if (bridge?.cancelBlackPreview?.()) return;
  } catch {
    // Fall through to postMessage if same-origin direct access is unavailable.
  }
  postAtlasMessage({ type: 'stone-composition-cancel-black-preview' });
};
""" + text[e:]

          old = """  const state = atlasPortalState;
  const rawAmount = Number(state?.returnAmount);
  const amount = Number.isFinite(rawAmount) ? clamp(rawAmount, 0, 1) : 0;
  const rawDwell = Number(state?.returnDwellProgress);
  blackReturnOverlayProgress = Number.isFinite(rawDwell)
    ? clamp(rawDwell, 0, 1)
    : 0;
  if (amount > 0.001) {
    syncBlackFromAtlas(state);
  } else if (blackPortalMatch) {
    restoreBlackPortalMatch(false);
  }
  portalPreviewFrame.style.opacity = String(1 - PORTAL_MAX_OPACITY * amount);
"""
          new = """  let state = atlasPortalState;
  const bridge = atlasEmbedBridge();
  try {
    state = bridge?.portalState?.() || state;
  } catch {
    // Keep the last postMessage state if direct access is unavailable.
  }
  const rawDwell = Number(state?.returnDwellProgress);
  const dwellProgress = Number.isFinite(rawDwell)
    ? clamp(rawDwell, 0, 1)
    : 0;
  blackReturnOverlayProgress = dwellProgress;
  const amount = dwellProgress > 0 ? smoothstep(dwellProgress) : 0;
  if (amount > 0.001) {
    syncBlackFromAtlas(state);
  } else if (blackPortalMatch) {
    restoreBlackPortalMatch(false);
  }
  portalPreviewFrame.style.opacity = String(1 - PORTAL_MAX_OPACITY * amount);
"""
          if text.count(old) != 1:
              raise SystemExit(f'return visibility block count {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """      const beginRotation = event => {
        portalEntryHeld = false;
        dragging = true;
"""
          new = """      const beginRotation = event => {
        portalEntryHeld = false;
        if (!explainer.active && compositionMode === 'black') ensurePortalPreview();
        dragging = true;
"""
          if text.count(old) != 1:
              raise SystemExit(f'beginRotation anchor count {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """        const appliedPitchDelta = nextPitch - pitch;
        pitch = nextPitch;

        const sampleYawVelocity = yawDelta / dt;
"""
          new = """        const appliedPitchDelta = nextPitch - pitch;
        pitch = nextPitch;

        if (
          compositionMode === 'black' && atlasReady && !explainer.active &&
          portalAngularDistance() <= PORTAL_PREVIEW_RADIUS
        ) syncAtlasFromBlack();

        const sampleYawVelocity = yawDelta / dt;
"""
          if text.count(old) != 1:
              raise SystemExit(f'moveRotation anchor count {text.count(old)}')
          text = text.replace(old, new, 1)

          p.write_text(text)

          agents = Path('AGENTS.md')
          lines = agents.read_text().splitlines()
          prefix = '- A hidden black→white composition doorway to the Philosopher’s Stone Atlas uses the exact vertically mirrored orientation'
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f'AGENTS portal bullet count {len(matches)}')
          lines[matches[0]] = '- A hidden black→white composition doorway to the Philosopher’s Stone Atlas uses the exact vertically mirrored orientation yaw π/4, pitch −asin(1/√3); it is deliberately not a fifth magnetic snap. The browser stays on the current `/42/` page. The Atlas begins warming on the first ordinary Stone rotation, while the 8° outer window remains a fallback preload boundary; inside the final 5°, its Stone is synchronized directly to the black Stone’s projected pose and crossfaded up to 52%. The seam uses a near-orthographic 1.15° perspective lens only for geometric continuity. Releasing inside the doorway commits without navigation into a held white seam: the Atlas Stone remains in the black Stone’s exact orientation/framing while only the Atlas control panel stays hidden until the first new Atlas interaction; the plot, background, and labels remain visible; only then does it transition over about 0.9 s into its native layout/orientation and 45° perspective without blocking the interaction. Returning to black no longer uses a fixed reciprocal doorway: a deliberate fast Atlas throw above the normal snap range arms a momentum-preserving capture. Native angular momentum continues to decay while a gentle attraction increasingly pulls the Stone toward the exact quaternion corresponding to the black main view yaw π/4, pitch +asin(1/√3). During the final 12° the Atlas lens progressively flattens toward the seam, but the black Stone remains hidden throughout the free-spin/attraction phase. Touching again cancels the capture. Once the existing two-second untouched deterministic approach begins, the bare black wireframe crossfades in while the default black overlay reveals radially outward and the Stone smoothly reaches the exact black main orientation; cancellation reverses the orientation transition smoothly, and completion yields to black while the Stone slides into `/42/`’s native framing.'
          agents.write_text('\n'.join(lines) + '\n')
          PY
          grep -F 'transition: none;' index.html | head -1
          grep -F 'window.STONE_EMBED' ../epistemic-octahedron-does-not-exist 2>/dev/null || true
          grep -F 'const atlasEmbedBridge' index.html
          grep -F 'const amount = dwellProgress > 0 ? smoothstep(dwellProgress) : 0;' index.html
          grep -F "if (!explainer.active && compositionMode === 'black') ensurePortalPreview();" index.html
          grep -F 'The Atlas begins warming on the first ordinary Stone rotation' AGENTS.md
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/portal-sync-fix-once.yml
          git add index.html AGENTS.md
          git commit -m 'Synchronize Stone portal transitions'
          git push
