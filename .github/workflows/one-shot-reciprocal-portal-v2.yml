name: One-shot reciprocal Stone portal v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-reciprocal-portal-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hidden atlas portal
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old,new,1)

          p=Path('index.html')
          s=p.read_text()

          portal_css='''    #portal-preview {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            background: #f8fafc;
            transition: opacity 80ms linear;
          }
          #portal-preview.is-committing {
            opacity: 1 !important;
            transition: opacity 220ms ease;
          }
          '''
          s=once(s,'    #stone-shell {\n',portal_css+'    #stone-shell {\n','portal CSS insertion')

          identity='      const identity = philosopherStone ? "The Philosopher\'s Stone" : \'Epistemic Octahedron\';\n'
          portal_url='''      const identity = philosopherStone ? "The Philosopher's Stone" : 'Epistemic Octahedron';
          const portalParams = new URLSearchParams(location.search);
          const portalPreviewMode = portalParams.get('portal-preview') === '1';
          const portalArrival = portalParams.get('portal') === 'from-atlas';
          const ATLAS_URL = 'https://raulmiguelparasiii.github.io/epistemic-octahedron/philosophers-stone-atlas/';
          '''
          s=once(s,identity,portal_url,'portal URL state')

          explainer_start='      const EXPLAINER_SCRIPT = `What Makes a Person Mature?\n'
          portal_constants='''      const PORTAL_YAW = Math.PI / 4;
          const PORTAL_PITCH = -MAIN_PITCH;
          const PORTAL_PRELOAD_RADIUS = 8 * Math.PI / 180;
          const PORTAL_PREVIEW_RADIUS = 4 * Math.PI / 180;
          const PORTAL_MAX_OPACITY = 0.52;
          let portalPreviewFrame = null;
          let portalTransitioning = false;
          let portalArrivalLocked = portalArrival;
          let portalEntryHeld = portalPreviewMode || portalArrival;

          '''
          s=once(s,explainer_start,portal_constants+explainer_start,'portal constants')

          s=once(s,'      let yaw = snaps[0].yaw;\n','      let yaw = portalEntryHeld ? PORTAL_YAW : snaps[0].yaw;\n','portal yaw start')
          s=once(s,'      let pitch = snaps[0].pitch;\n','      let pitch = portalEntryHeld ? PORTAL_PITCH : snaps[0].pitch;\n','portal pitch start')
          s=once(s,'      let snapTarget = snaps[0];\n','      let snapTarget = portalEntryHeld ? null : snaps[0];\n','portal snap start')

          smooth='      const smoothstep = value => value * value * (3 - 2 * value);\n'
          portal_logic='''      const smoothstep = value => value * value * (3 - 2 * value);
          const portalAngularDistance = () => Math.hypot(
            wrap(PORTAL_YAW - yaw),
            PORTAL_PITCH - pitch
          );
          const ensurePortalPreview = () => {
            if (portalPreviewMode || portalPreviewFrame) return portalPreviewFrame;
            const frame = document.createElement('iframe');
            frame.id = 'portal-preview';
            frame.title = '';
            frame.tabIndex = -1;
            frame.setAttribute('aria-hidden', 'true');
            frame.src = ATLAS_URL + '?portal-preview=1';
            document.body.appendChild(frame);
            portalPreviewFrame = frame;
            return frame;
          };
          const updatePortalPreview = () => {
            if (portalPreviewMode || portalTransitioning) return;
            const distance = portalAngularDistance();
            if (portalArrivalLocked) {
              if (distance > PORTAL_PREVIEW_RADIUS * 1.5) portalArrivalLocked = false;
              if (portalPreviewFrame) portalPreviewFrame.style.opacity = '0';
              return;
            }
            if (distance < PORTAL_PRELOAD_RADIUS) ensurePortalPreview();
            const active = dragging && !explainer.active;
            const amount = active ? clamp(1 - distance / PORTAL_PREVIEW_RADIUS, 0, 1) : 0;
            const opacity = PORTAL_MAX_OPACITY * smoothstep(amount);
            if (portalPreviewFrame) portalPreviewFrame.style.opacity = String(opacity);
          };
          const commitPortal = () => {
            if (
              portalPreviewMode || portalArrivalLocked || portalTransitioning ||
              explainer.active || !dragging ||
              portalAngularDistance() > PORTAL_PREVIEW_RADIUS
            ) return false;
            portalTransitioning = true;
            portalEntryHeld = false;
            velocityYaw = 0;
            velocityPitch = 0;
            snapTarget = null;
            const frame = ensurePortalPreview();
            if (frame) {
              frame.classList.add('is-committing');
              frame.style.opacity = '1';
            }
            setTimeout(() => location.assign(ATLAS_URL + '?portal=from42'), 230);
            return true;
          };
          '''
          s=once(s,smooth,portal_logic,'portal behavior')

          settle='      const settlePhysics = (now, dt) => {\n        if (dragging) return;\n'
          settle_new='''      const settlePhysics = (now, dt) => {
            if (dragging) return;
            if (portalEntryHeld && !explainer.active) {
              velocityYaw = 0;
              velocityPitch = 0;
              snapTarget = null;
              return;
            }
          '''
          s=once(s,settle,settle_new,'portal arrival hold')

          s=once(s,'        draw();\n        requestAnimationFrame(frame);\n','        draw();\n        updatePortalPreview();\n        requestAnimationFrame(frame);\n','portal preview frame')
          s=once(s,'      const beginRotation = event => {\n','      const beginRotation = event => {\n        portalEntryHeld = false;\n','portal hold release')

          stop='      const stopDrag = event => {\n        if (!dragging) return;\n'
          stop_new='''      const stopDrag = event => {
            if (!dragging) return;
            const portalCommitted = commitPortal();
          '''
          s=once(s,stop,stop_new,'portal release check')
          s=once(s,'        if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);\n\n        if (explainer.active) {\n','        if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);\n        if (portalCommitted) return;\n\n        if (explainer.active) {\n','portal release commit')

          total='      explainerTotal.textContent = formatTime(currentExplainerDuration());\n'
          s=once(s,total,total+"      if (portalArrival) history.replaceState(null, '', location.pathname);\n",'clean portal URL')
          p.write_text(s)

          a_path=Path('AGENTS.md')
          a=a_path.read_text()
          default='- Default orientation is the exact symmetric face-on star view: yaw π/4, pitch asin(1/√3).\n'
          portal_memory=default+'- A hidden reciprocal portal to the Philosopher’s Stone Atlas uses the exact vertically mirrored orientation yaw π/4, pitch −asin(1/√3); it is deliberately not a fifth magnetic snap. While the Stone is actively held within a 4° angular window, the atlas is lazily preloaded and crossfaded up to 52%, receding continuously as the user pulls away. Releasing inside that window commits a fast full-page transition. Portal previews cannot recursively open another portal, and a portal arrival holds the exact doorway orientation until the user begins dragging and stays return-locked until the Stone leaves the doorway zone. The atlas implements the same mechanism in reverse at its visually equivalent quaternion.\n'
          a=once(a,default,portal_memory,'portal project memory')
          a=once(a,'- Hostname-sensitive identity is established in one place. No conventional navigation beyond the guided explainer has been chosen yet.\n','- Hostname-sensitive identity is established in one place. There is still no conventional navbar; the only page-level navigation is the hidden reciprocal Stone portal to the Atlas.\n','portal navigation memory')
          a_path.write_text(a)
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-reciprocal-portal-v2.yml
          git add index.html AGENTS.md
          git diff --cached --check
          git commit -m "Add hidden reciprocal atlas portal"
          git push
