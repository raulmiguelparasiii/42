name: One-shot reciprocal Stone portal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-reciprocal-portal.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hidden atlas portal
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          path = Path('index.html')
          s = path.read_text()

          s = replace_once(
              s,
              '''    #app {
                position: relative;
                display: grid;
                place-items: center;
                width: 100%;
                height: 100dvh;
                background: #000;
              }
              #stone-shell {
          ''',
              '''    #app {
                position: relative;
                display: grid;
                place-items: center;
                width: 100%;
                height: 100dvh;
                background: #000;
              }
              #portal-preview {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                border: 0;
                display: block;
                opacity: 0;
                pointer-events: none;
                z-index: 20;
                background: #f8fafc;
                transition: opacity 80ms linear;
              }
              #portal-preview.is-committing {
                opacity: 1 !important;
                transition: opacity 220ms ease;
              }
              #stone-shell {
          ''',
              'portal preview CSS'
          )

          s = replace_once(
              s,
              '''      const philosopherStone = host === 'thephilosophersstone.com' || host === 'www.thephilosophersstone.com';
                    const identity = philosopherStone ? "The Philosopher's Stone" : 'Epistemic Octahedron';

                    document.title = identity;
          ''',
              '''      const philosopherStone = host === 'thephilosophersstone.com' || host === 'www.thephilosophersstone.com';
                    const identity = philosopherStone ? "The Philosopher's Stone" : 'Epistemic Octahedron';
                    const portalParams = new URLSearchParams(location.search);
                    const portalPreviewMode = portalParams.get('portal-preview') === '1';
                    const portalArrival = portalParams.get('portal') === 'from-atlas';
                    const ATLAS_URL = 'https://raulmiguelparasiii.github.io/epistemic-octahedron/philosophers-stone-atlas/';

                    document.title = identity;
          ''',
              'portal URL state'
          )

          s = replace_once(
              s,
              '''      const snaps = [
                { id: 'main', yaw: Math.PI / 4, pitch: MAIN_PITCH },
                { id: 'top', yaw: Math.PI / 4, pitch: Math.PI / 2 },
                { id: 'side', yaw: Math.PI / 4, pitch: 0 },
                { id: 'bottom', yaw: Math.PI / 4, pitch: -Math.PI / 2 }
              ];

              const EXPLAINER_SCRIPT = `What Makes a Person Mature?
          ''',
              '''      const snaps = [
                { id: 'main', yaw: Math.PI / 4, pitch: MAIN_PITCH },
                { id: 'top', yaw: Math.PI / 4, pitch: Math.PI / 2 },
                { id: 'side', yaw: Math.PI / 4, pitch: 0 },
                { id: 'bottom', yaw: Math.PI / 4, pitch: -Math.PI / 2 }
              ];
              const PORTAL_YAW = Math.PI / 4;
              const PORTAL_PITCH = -MAIN_PITCH;
              const PORTAL_PRELOAD_RADIUS = 8 * Math.PI / 180;
              const PORTAL_PREVIEW_RADIUS = 4 * Math.PI / 180;
              const PORTAL_MAX_OPACITY = 0.52;
              let portalPreviewFrame = null;
              let portalTransitioning = false;
              let portalArrivalLocked = portalArrival;
              let portalEntryHeld = portalPreviewMode || portalArrival;

              const EXPLAINER_SCRIPT = `What Makes a Person Mature?
          ''',
              'portal constants'
          )

          s = replace_once(
              s,
              '''      let yaw = snaps[0].yaw;
              let pitch = snaps[0].pitch;
              let velocityYaw = 0;
              let velocityPitch = 0;
              let dragging = false;
              let snapTarget = snaps[0];
          ''',
              '''      let yaw = portalEntryHeld ? PORTAL_YAW : snaps[0].yaw;
              let pitch = portalEntryHeld ? PORTAL_PITCH : snaps[0].pitch;
              let velocityYaw = 0;
              let velocityPitch = 0;
              let dragging = false;
              let snapTarget = portalEntryHeld ? null : snaps[0];
          ''',
              'portal initial orientation'
          )

          s = replace_once(
              s,
              '''      const smoothstep = value => value * value * (3 - 2 * value);
              const updateFirstPrinciplesScrollHint = () => {
          ''',
              '''      const smoothstep = value => value * value * (3 - 2 * value);
              const portalAngularDistance = () => Math.hypot(
                wrap(PORTAL_YAW - yaw),
                PORTAL_PITCH - pitch
              );
              const ensurePortalPreview = () => {
                if (portalPreviewMode || portalPreviewFrame) return portalPreviewFrame;
                const frame = document.createElement('iframe');
                frame.id = 'portal-preview';
                frame.title = '';
                frame.tabIndex = -1;
                frame.setAttribute('aria-hidden', 'true');
                frame.src = ATLAS_URL + '?portal-preview=1';
                document.body.appendChild(frame);
                portalPreviewFrame = frame;
                return frame;
              };
              const updatePortalPreview = () => {
                if (portalPreviewMode || portalTransitioning) return;
                const distance = portalAngularDistance();
                if (portalArrivalLocked) {
                  if (distance > PORTAL_PREVIEW_RADIUS * 1.5) portalArrivalLocked = false;
                  if (portalPreviewFrame) portalPreviewFrame.style.opacity = '0';
                  return;
                }
                if (distance < PORTAL_PRELOAD_RADIUS) ensurePortalPreview();
                const active = dragging && !explainer.active;
                const amount = active
                  ? clamp(1 - distance / PORTAL_PREVIEW_RADIUS, 0, 1)
                  : 0;
                const opacity = PORTAL_MAX_OPACITY * smoothstep(amount);
                if (portalPreviewFrame) portalPreviewFrame.style.opacity = String(opacity);
              };
              const commitPortal = () => {
                if (
                  portalPreviewMode ||
                  portalArrivalLocked ||
                  portalTransitioning ||
                  explainer.active ||
                  !dragging ||
                  portalAngularDistance() > PORTAL_PREVIEW_RADIUS
                ) return false;

                portalTransitioning = true;
                portalEntryHeld = false;
                velocityYaw = 0;
                velocityPitch = 0;
                snapTarget = null;
                const frame = ensurePortalPreview();
                if (frame) {
                  frame.classList.add('is-committing');
                  frame.style.opacity = '1';
                }
                setTimeout(() => {
                  location.assign(ATLAS_URL + '?portal=from42');
                }, 230);
                return true;
              };
              const updateFirstPrinciplesScrollHint = () => {
          ''',
              'portal preview logic'
          )

          s = replace_once(
              s,
              '''      const settlePhysics = (now, dt) => {
                if (dragging) return;

                if (reduceMotion) {
          ''',
              '''      const settlePhysics = (now, dt) => {
                if (dragging) return;
                if (portalEntryHeld && !explainer.active) {
                  velocityYaw = 0;
                  velocityPitch = 0;
                  snapTarget = null;
                  return;
                }

                if (reduceMotion) {
          ''',
              'portal arrival hold'
          )

          s = replace_once(
              s,
              '''        settlePhysics(now, dt);
                draw();
                requestAnimationFrame(frame);
          ''',
              '''        settlePhysics(now, dt);
                draw();
                updatePortalPreview();
                requestAnimationFrame(frame);
          ''',
              'portal frame preview'
          )

          s = replace_once(
              s,
              '''      const beginRotation = event => {
                dragging = true;
                snapTarget = null;
          ''',
              '''      const beginRotation = event => {
                portalEntryHeld = false;
                dragging = true;
                snapTarget = null;
          ''',
              'release portal arrival hold on drag'
          )

          s = replace_once(
              s,
              '''      const stopDrag = event => {
                if (!dragging) return;
                dragging = false;
                releasedAt = performance.now();
                if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);

                if (explainer.active) {
          ''',
              '''      const stopDrag = event => {
                if (!dragging) return;
                const portalCommitted = commitPortal();
                dragging = false;
                releasedAt = performance.now();
                if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId);
                if (portalCommitted) return;

                if (explainer.active) {
          ''',
              'portal release commit'
          )

          s = replace_once(
              s,
              '''      explainerLaunch.classList.remove('is-visible');
              firstPrinciplesPanel.classList.remove('is-visible');
              explainerTotal.textContent = formatTime(currentExplainerDuration());

              draw();
          ''',
              '''      explainerLaunch.classList.remove('is-visible');
              firstPrinciplesPanel.classList.remove('is-visible');
              explainerTotal.textContent = formatTime(currentExplainerDuration());
              if (portalArrival) history.replaceState(null, '', location.pathname);

              draw();
          ''',
              'clean portal arrival URL'
          )

          path.write_text(s)

          agents = Path('AGENTS.md')
          a = agents.read_text()
          a = replace_once(
              a,
              '''- Default orientation is the exact symmetric face-on star view: yaw π/4, pitch asin(1/√3).
          ''',
              '''- Default orientation is the exact symmetric face-on star view: yaw π/4, pitch asin(1/√3).
              - A hidden reciprocal portal to the Philosopher’s Stone Atlas uses the exact vertically mirrored orientation yaw π/4, pitch −asin(1/√3); it is deliberately not a fifth magnetic snap. While the Stone is actively held within a 4° angular window, the atlas is lazily preloaded and crossfaded up to 52%, receding continuously as the user pulls away. Releasing inside that window commits a fast full-page transition. Portal previews cannot recursively open another portal, and a portal arrival holds the exact doorway orientation until the user begins dragging and stays return-locked until the Stone leaves the doorway zone. The atlas implements the same mechanism in reverse at its visually equivalent quaternion.
          ''',
              'portal project memory'
          )
          a = replace_once(
              a,
              '''- Hostname-sensitive identity is established in one place. No conventional navigation beyond the guided explainer has been chosen yet.
          ''',
              '''- Hostname-sensitive identity is established in one place. There is still no conventional navbar; the only page-level navigation is the hidden reciprocal Stone portal to the Atlas.
          ''',
              'portal navigation memory'
          )
          agents.write_text(a)
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-reciprocal-portal.yml
          git add index.html AGENTS.md
          git diff --cached --check
          git commit -m "Add hidden reciprocal atlas portal"
          git push
