name: One-shot hybrid composition controller

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-hybrid-controller.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply controller patch
        run: python .tmp_hybrid_parent_patch.py
      - name: Validate controller state
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=Path('AGENTS.md').read_text()
          required=[
            "!state?.returnReady",
            "const rawAmount = Number(state?.returnAmount);",
            "if (atlasPortalState?.returnReady) commitReturnPortal(atlasPortalState);",
            "compositionMode === 'atlas' || portalTransitioning",
          ]
          for token in required:
            if token not in s: raise SystemExit(f'missing {token}')
          if 'a deliberate fast Atlas throw above the normal snap range arms a momentum-preserving capture' not in a:
            raise SystemExit('AGENTS current state was not updated')
          if 'location.assign(ATLAS_URL' in s:
            raise SystemExit('page-navigation portal unexpectedly returned')
          print('Hybrid parent controller validation passed.')
          PY
      - name: Commit implementation and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .tmp_hybrid_parent_patch.py .github/workflows/one-shot-hybrid-controller.yml
          git add index.html AGENTS.md
          git commit -m 'Use momentum return with perspective Atlas'
          git push
