name: Fix Purpose cue

on:
  push:
    paths:
      - .github/workflows/fix-purpose-cue.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cue and scene
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()

          cue_old = "        { at: explainerTimeFor('We now have three distinct conditions.'), scene: 'three-states' },\n        { at: explainerTimeFor('That is information.'), scene: 'meaning-prep', camera: 'meaningCross' },"
          cue_new = "        { at: explainerTimeFor('We now have three distinct conditions.'), scene: 'three-states' },\n        { at: explainerTimeFor('We have discussed concern and constraint.'), scene: 'purpose-intro' },\n        { at: explainerTimeFor('That is information.'), scene: 'meaning-prep', camera: 'meaningCross' },"
          if cue_old not in text:
              raise SystemExit('cue anchor not found')
          text = text.replace(cue_old, cue_new, 1)

          scene_old = "          'meaning-prep': {\n            axes: [1, 2], dimAxes: [0], verticalMode: 'full', edges: false,\n            axisLabels: { M: 'Answerability', C: 'Insulation', K: 'Knowledge' },\n            header: 'Information',\n            subtext: 'What is actually happening?',\n            markers: [[0, 0, -1]]\n          },"
          scene_new = "          'purpose-intro': {\n            axes: [0, 1], verticalMode: 'full', edges: false,\n            emphasize: [0], focusAxes: true,\n            axisLabels: { E: 'Concern', P: 'Constraint' },\n            purposeRelation: true,\n            header: 'Purpose',\n            subtext: 'Concern and constraint organize what matters and what can actually be done.'\n          },\n          'meaning-prep': {\n            axes: [1, 2], dimAxes: [0], verticalMode: 'full', edges: false,\n            axisLabels: { M: 'Answerability', C: 'Insulation', K: 'Knowledge' },\n            header: 'Information',\n            subtext: 'What is actually happening?',\n            markers: [[0, 0, -1]]\n          },"
          if scene_old not in text:
              raise SystemExit('scene anchor not found')
          index.write_text(text.replace(scene_old, scene_new, 1))

          agents = Path('AGENTS.md')
          memory = agents.read_text()
          old = "In the Purpose focus scene, E is labeled Concern, P is labeled Constraint, and a separate Purpose label is connected by a thin leader line to the midpoint of the emphasized P–E axis so the relation itself is named, not just its endpoints."
          new = "When the narration first says ‘We have discussed concern and constraint’ around 6:10, a dedicated Purpose scene emphasizes P–E, labels E as Concern and P as Constraint, and connects a separate Purpose label by a thin leader line to the midpoint of that axis. The later full-structure Purpose recap reuses the same annotation."
          if old not in memory:
              raise SystemExit('AGENTS anchor not found')
          agents.write_text(memory.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html AGENTS.md
          git commit -m "Move Purpose annotation to 6:10 cue"
          git push
