name: Apply Purpose cue timing fix

on:
  push:
    paths:
      - '.github/workflows/fix-purpose-cue.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Remove temporary Purpose cue workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Purpose cue
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()

          cue_old = """        { at: explainerTimeFor('We now have three distinct conditions.'), scene: 'three-states' },
        { at: explainerTimeFor('That is information.'), scene: 'meaning-prep', camera: 'meaningCross' },"""
          cue_new = """        { at: explainerTimeFor('We now have three distinct conditions.'), scene: 'three-states' },
        { at: explainerTimeFor('We have discussed concern and constraint.'), scene: 'purpose-intro' },
        { at: explainerTimeFor('That is information.'), scene: 'meaning-prep', camera: 'meaningCross' },"""
          if cue_old not in text:
              raise SystemExit('Purpose cue anchor not found')
          text = text.replace(cue_old, cue_new, 1)

          scene_old = """          'meaning-prep': {
            axes: [1, 2], dimAxes: [0], verticalMode: 'full', edges: false,
            axisLabels: { M: 'Answerability', C: 'Insulation', K: 'Knowledge' },
            header: 'Information',
            subtext: 'What is actually happening?',
            markers: [[0, 0, -1]]
          },"""
          scene_new = """          'purpose-intro': {
            axes: [0, 1], verticalMode: 'full', edges: false,
            emphasize: [0], focusAxes: true,
            axisLabels: { E: 'Concern', P: 'Constraint' },
            purposeRelation: true,
            header: 'Purpose',
            subtext: 'Concern and constraint organize what matters and what can actually be done.'
          },
          'meaning-prep': {
            axes: [1, 2], dimAxes: [0], verticalMode: 'full', edges: false,
            axisLabels: { M: 'Answerability', C: 'Insulation', K: 'Knowledge' },
            header: 'Information',
            subtext: 'What is actually happening?',
            markers: [[0, 0, -1]]
          },"""
          if scene_old not in text:
              raise SystemExit('Purpose scene anchor not found')
          text = text.replace(scene_old, scene_new, 1)
          index.write_text(text)

          agents = Path('AGENTS.md')
          memory = agents.read_text()
          memory_old = "In the Purpose focus scene, E is labeled Concern, P is labeled Constraint, and a separate Purpose label is connected by a thin leader line to the midpoint of the emphasized P–E axis so the relation itself is named, not just its endpoints."
          memory_new = "When the narration first says ‘We have discussed concern and constraint’ around 6:10, a dedicated Purpose scene emphasizes P–E, labels E as Concern and P as Constraint, and connects a separate Purpose label by a thin leader line to the midpoint of that axis. The later full-structure Purpose recap reuses the same annotation."
          if memory_old not in memory:
              raise SystemExit('AGENTS Purpose anchor not found')
          agents.write_text(memory.replace(memory_old, memory_new, 1))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html AGENTS.md
          git commit -m "Move Purpose annotation to 6:10 cue"
          git push
