body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;-webkit-user-select:none;user-select:none}

.hold{fill:none;stroke:#777;stroke-width:.85;stroke-linejoin:round;pointer-events:none;opacity:0;stroke-dasharray:100;stroke-dashoffset:100}
.label-group.arming .hold{opacity:.78;stroke-dashoffset:0;transition:stroke-dashoffset 850ms linear}
.label-group.armed .hold{opacity:.92;stroke:#000;stroke-dashoffset:0;transition:none}

#sheet-handle::before{content:"";width:46px;height:5px;border-radius:999px;background:#999;display:block}
#control-body{width:min(1040px,100%);margin:auto;display:grid;gap:12px}
.card{border-top:1px solid #ddd;padding-top:9px;display:grid;gap:7px}
.card:first-child{border:0;padding-top:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#777}
.acts{display:flex;gap:6px}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:minmax(145px,1fr) repeat(4,auto);gap:6px;align-items:center;min-height:33px}
.name{font-size:13px}.name small{font-size:11px;color:#777}
.b{border:1px solid #ccc;background:#fff;color:#111;border-radius:999px;padding:6px 9px;min-width:64px;font-size:12px;cursor:pointer}
.b.on,.b.black{background:#000;color:#fff;border-color:#000}.b:disabled{opacity:.3}

</style>
